<section class="manual">

<div class="card">

<h2 class="page-title">
Manual Check-in
</h2>

<div class="form-group">

<input
id="memberID"
type="text"
placeholder="Enter Member ID"
autocomplete="off"
autocapitalize="characters">

</div>

<button
id="manualBtn"
class="btn-primary">

Check In

</button>

</div>

<div
id="scanResult"
class="scan-result hidden">

<div
id="resultIcon"
class="result-icon"></div>

<div
id="resultTitle"
class="result-title"></div>

<div
id="resultMessage"
class="result-message"></div>

<div class="result-info">

<div><span>🆔</span><span id="resultID"></span></div>

<div><span>⛪</span><span id="resultChurch"></span></div>

<div><span>📍</span><span id="resultLocation"></span></div>

<div><span>🕒</span><span id="resultTime"></span></div>

</div>

</div>

</section>
